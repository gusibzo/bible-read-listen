<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구약 · 신약 읽고 듣고 따라하기</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #faf8f5;
      --bg-card: #ffffff;
      --bg-header: #ffffff;
      --border-card: #e7e5e4;
      --ink-main: #1e293b;
      --ink-en: #475569;
      --ink-muted: #64748b;
      --hl-done: #1d4ed8;
      --hl-active-ink: #b45309;
      --hl-active-bg: #fef3c7;
      --hl-active-ring: #fde68a;
      --sent-active-bg: #f8fafc;
      --sent-active-bar: #f59e0b;
      --card-active-border: #6366f1;
    }
    body.theme-sepia {
      --bg-page: #f4ecd8;
      --bg-card: #fbf6ea;
      --bg-header: #f8f1df;
      --border-card: #e2d5b5;
      --ink-main: #3f2e1d;
      --ink-en: #6b533b;
      --ink-muted: #856b50;
      --sent-active-bg: #f3e8cf;
    }
    body.theme-dark {
      --bg-page: #0f172a;
      --bg-card: #1e293b;
      --bg-header: #1e293b;
      --border-card: #334155;
      --ink-main: #f1f5f9;
      --ink-en: #cbd5e1;
      --ink-muted: #94a3b8;
      --hl-done: #93c5fd;
      --hl-active-ink: #fde68a;
      --hl-active-bg: #78350f;
      --hl-active-ring: #b45309;
      --sent-active-bg: #263449;
      --sent-active-bar: #fbbf24;
      --card-active-border: #818cf8;
    }
    body.theme-forest {
      --bg-page: #f0f5f1;
      --bg-card: #ffffff;
      --bg-header: #f7fbf8;
      --border-card: #d1e0d5;
      --ink-main: #1a2e22;
      --ink-en: #3d5a48;
      --ink-muted: #5c7a67;
      --sent-active-bg: #e8f3ec;
    }
    body.hl-emerald {
      --hl-done: #0f766e;
      --hl-active-ink: #065f46;
      --hl-active-bg: #d1fae5;
      --hl-active-ring: #6ee7b7;
      --sent-active-bar: #10b981;
    }
    body.theme-dark.hl-emerald {
      --hl-done: #5eead4;
      --hl-active-ink: #a7f3d0;
      --hl-active-bg: #064e3b;
      --hl-active-ring: #059669;
    }
    body.hl-rose {
      --hl-done: #7e22ce;
      --hl-active-ink: #be123c;
      --hl-active-bg: #ffe4e6;
      --hl-active-ring: #fda4af;
      --sent-active-bar: #f43f5e;
    }
    body.theme-dark.hl-rose {
      --hl-done: #d8b4fe;
      --hl-active-ink: #fecdd3;
      --hl-active-bg: #881337;
      --hl-active-ring: #e11d48;
    }
    body.hl-sky {
      --hl-done: #1e40af;
      --hl-active-ink: #0369a1;
      --hl-active-bg: #e0f2fe;
      --hl-active-ring: #7dd3fc;
      --sent-active-bar: #0ea5e9;
    }
    body.theme-dark.hl-sky {
      --hl-done: #93c5fd;
      --hl-active-ink: #bae6fd;
      --hl-active-bg: #0c4a6e;
      --hl-active-ring: #0284c7;
    }
    body {
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--ink-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .serif-kr {
      font-family: 'Noto Serif KR', 'Noto Sans KR', serif;
    }
    body.font-sans-all .serif-kr {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }
    .themed-header {
      background-color: var(--bg-header);
      border-color: var(--border-card);
    }
    .themed-card {
      background-color: var(--bg-card);
      border-color: var(--border-card);
      color: var(--ink-main);
    }
    .themed-en {
      color: var(--ink-en);
    }
    .word-token {
      transition: color 0.14s ease, background-color 0.14s ease;
      border-radius: 0.25rem;
      padding: 0 1px;
    }
    .word-done {
      color: var(--hl-done);
      font-weight: 500;
    }
    .word-active {
      color: var(--hl-active-ink);
      background-color: var(--hl-active-bg);
      font-weight: 700;
      box-shadow: 0 0 0 2px var(--hl-active-ring);
    }
    .verse-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      scroll-margin-top: 16px;
      scroll-margin-bottom: 80px;
    }
    .verse-card-active {
      border-color: var(--card-active-border) !important;
      box-shadow: 0 10px 28px -8px rgba(79, 70, 229, 0.22), 0 0 0 1px rgba(99, 102, 241, 0.25);
    }
    .sentence-block-active {
      background-color: var(--sent-active-bg);
      border-left: 3px solid var(--sent-active-bar);
      padding-left: 0.75rem;
      border-radius: 0.375rem;
    }
/* One-verse reader */
#verseReader[hidden] {
  display: none;
}

#verseReader {
  --vr-accent: var(--hl-active-ink, #92400e);
  --vr-accent-bg: var(--hl-active-bg, #fef3c7);
  --vr-accent-ring: var(--hl-active-ring, #fde68a);
  --vr-border: var(--border-card, #e7e5e4);
  --vr-radius: 1.25rem;
  position: fixed;
  inset: 0;
  box-sizing: border-box;
  grid-template-rows: auto minmax(0, 1fr) auto;
  width: 100%;
  height: 100%;
  height: 100dvh;
  max-width: none;
  max-height: none;
  margin: 0;
  padding: max(.5rem, env(safe-area-inset-top)) max(.5rem, env(safe-area-inset-right))
    max(.35rem, env(safe-area-inset-bottom)) max(.5rem, env(safe-area-inset-left));
  overflow: hidden;
  color: var(--ink-main, #1e293b);
  background: var(--bg-page, #faf8f5);
}

#verseReader[open] {
  display: grid;
}

#verseReader .vr-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .625rem 1rem;
  padding: .65rem;
  background: var(--bg-header, #fff);
  border: 1px solid var(--vr-border);
  border-radius: var(--vr-radius) var(--vr-radius) 0 0;
}

#verseReader .vr-head {
  display: flex;
  flex: 1 0 100%;
  align-items: center;
  gap: .5rem;
}

#vrChapter {
  max-width: 100%;
  min-width: 0;
}

#verseReader .vr-nav,
#verseReader .vr-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .375rem;
  min-width: 0;
}

.vr-button {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  min-height: 2.75rem;
  padding: .5rem .75rem;
  color: var(--ink-main, #1e293b);
  background: var(--bg-card, #fff);
  border: 1px solid var(--border-card, #d6d3d1);
  border-radius: .625rem;
  font: inherit;
  font-size: .875rem;
  font-weight: 650;
  line-height: 1.25;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
}

.vr-button.vr-primary,
.vr-button[aria-pressed="true"] {
  color: var(--hl-active-ink, #92400e);
  background: var(--hl-active-bg, #fef3c7);
  border-color: var(--hl-active-ring, #fde68a);
}

.vr-button:disabled {
  opacity: .5;
  cursor: default;
}

@media (hover: hover) {
  .vr-button:not(:disabled):hover {
    border-color: var(--hl-active-ink, #92400e);
  }
}

.vr-button:focus-visible,
#verseReader .vr-feed:focus-visible,
.vr-dialog textarea:focus-visible {
  outline: 2px solid var(--hl-active-ink, #92400e);
  outline-offset: 2px;
}

#verseReader .vr-feed {
  min-height: 0;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  scroll-snap-type: y mandatory;
  scrollbar-width: thin;
  background: var(--bg-page, #faf8f5);
  border: 1px solid var(--vr-border);
  border-block-start: 0;
  border-radius: 0 0 var(--vr-radius) var(--vr-radius);
}

#verseReader .vr-slide {
  box-sizing: border-box;
  display: grid;
  min-height: 100%;
  place-items: center;
  padding: clamp(.75rem, 3vw, 1.75rem);
  scroll-snap-align: start;
  scroll-snap-stop: always;
}

#verseReader .vr-card {
  width: min(100%, 40rem);
  padding: clamp(1.125rem, 4.5vw, 2.5rem);
  overflow-wrap: anywhere;
  color: inherit;
  background: var(--bg-card, #fff);
  border: 1px solid var(--vr-border);
  border-block-start: .25rem solid var(--vr-accent-ring);
  border-radius: var(--vr-radius);
  box-shadow: 0 .375rem 1.5rem rgb(28 33 41 / 8%);
}

#verseReader .vr-card:focus-visible,
#verseReader .vr-card .vr-ref:focus-visible {
  outline: 2px solid var(--vr-accent);
  outline-offset: .2rem;
}

#verseReader .vr-card.vr-active,
#verseReader .vr-active .vr-card {
  border-block-start-color: var(--vr-accent);
}

#verseReader .vr-ref {
  margin-block: 0 .8rem;
  color: var(--vr-accent);
  font-size: .9rem;
  font-weight: 700;
  line-height: 1.35;
}

#verseReader .vr-ko,
#verseReader .vr-en {
  margin: 0;
  line-height: 1.65;
  text-wrap: pretty;
}

#verseReader .vr-ko {
  font-family: "Noto Serif KR", Georgia, serif;
  font-size: clamp(1.3rem, 4.4vw, 2rem);
  font-weight: 600;
  word-break: keep-all;
}

#verseReader .vr-en {
  color: var(--ink-en, #475569);
  font-family: Georgia, serif;
  font-size: clamp(1.05rem, 3vw, 1.35rem);
}

#verseReader .vr-ko:not([hidden]) + .vr-en:not([hidden]) {
  margin-block-start: 1rem;
  padding-block-start: 1rem;
  border-block-start: 1px solid var(--vr-border);
}

#verseReader .vr-status {
  min-height: 1.5em;
  margin-block: .5rem 0;
  color: var(--ink-muted, #64748b);
  font-size: .875rem;
}

.vr-dialog {
  position: fixed;
  inset: 0;
  width: min(32rem, calc(100% - 2rem));
  max-height: min(85vh, 42rem);
  max-height: min(85dvh, 42rem);
  margin: auto;
  padding: clamp(1rem, 4vw, 1.5rem);
  overflow: auto;
  color: var(--ink-main, #1e293b);
  background: var(--bg-card, #fff);
  border: 1px solid var(--border-card, #e7e5e4);
  border-radius: 1rem;
}

.vr-dialog::backdrop {
  background: rgb(15 23 42 / 55%);
}

.vr-dialog h2,
.vr-dialog h3 {
  font-weight: 700;
}

.vr-dialog-close {
  float: inline-end;
  margin-inline-start: .75rem;
}

.vr-dialog .vr-ref {
  color: var(--hl-active-ink, #92400e);
  font-weight: 700;
}

.vr-dialog label {
  display: block;
  margin-block: .75rem .35rem;
}

.vr-dialog textarea + .vr-button {
  margin-block-start: .65rem;
}

.vr-dialog .vr-status {
  color: var(--ink-muted, #64748b);
  font-size: .875rem;
}

.vr-dialog h2 {
  margin-block: 0 .8rem;
  font-size: 1.2rem;
}

.vr-dialog h3 {
  margin-block: .9rem .2rem;
  font-size: .95rem;
}

.vr-dialog p {
  margin-block: .25rem .75rem;
  line-height: 1.6;
}

.vr-dialog textarea {
  box-sizing: border-box;
  width: 100%;
  min-height: 7rem;
  padding: .65rem;
  color: inherit;
  background: var(--bg-page, #faf8f5);
  border: 1px solid var(--border-card, #e7e5e4);
  border-radius: .5rem;
  font: inherit;
  resize: vertical;
}

.vr-dialog menu,
.vr-dialog .vr-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: end;
  gap: .5rem;
  margin-block: .75rem 0;
  padding: 0;
}

@media (max-width: 38rem) {
  #verseReader .vr-toolbar {
    gap: .4rem;
    padding: .5rem;
  }

  #verseReader .vr-nav,
  #verseReader .vr-actions {
    gap: .25rem;
  }

  #verseReader .vr-button {
    padding-inline: .6rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  #verseReader .vr-feed {
    scroll-behavior: auto;
  }
}

#verseReader[data-font-size="normal"] .vr-ko {
  font-size: clamp(1.125rem, 3.7vw, 1.5rem);
}

#verseReader[data-font-size="normal"] .vr-en {
  font-size: clamp(1rem, 2.7vw, 1.2rem);
}

#verseReader[data-font-size="xlarge"] .vr-ko {
  font-size: clamp(1.5rem, 5vw, 2.25rem);
}

#verseReader[data-font-size="xlarge"] .vr-en {
  font-size: clamp(1.2rem, 3.5vw, 1.5rem);
}
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Top Header & Player Controls -->
  <header class="themed-header border-b shadow-sm">
    <div class="max-w-4xl mx-auto px-3 sm:px-6 py-3 space-y-2.5">
      <!-- Title & Testament Switcher -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-indigo-900 text-amber-300 flex items-center justify-center font-bold text-lg shadow-sm">
            ✝
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-bold leading-tight">구약 · 신약 읽고 듣고 따라하기</h1>
            <p class="text-xs text-slate-500">한글 한 문장 · 영어 한 문장 자동 낭독 &amp; 색상 따라가기</p>
          </div>
        </div>

        <!-- Testament Tabs: 구약 / 신약 -->
        <div class="inline-flex rounded-xl bg-stone-100 p-1 border border-stone-200" role="tablist" aria-label="성경 구분">
          <button id="tabOld" type="button" class="px-3.5 py-1.5 text-sm font-semibold rounded-lg transition-all bg-indigo-700 text-white shadow-sm">
            구약 <span class="text-xs opacity-75">(시편)</span>
          </button>
          <button id="tabNew" type="button" class="px-3.5 py-1.5 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900">
            신약 <span class="text-xs opacity-75">(마태복음)</span>
          </button>
        </div>
      </div>

      <!-- Chapter Selector Pills -->
      <div id="chapterTabs" class="flex flex-wrap items-center gap-1.5"></div>

      <!-- Player & Options Bar -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-stone-100">
        <div class="flex flex-wrap items-center gap-1.5">
          <button id="btnPlayPause" type="button" class="whitespace-nowrap inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-indigo-700 hover:bg-indigo-800 text-white text-xs sm:text-sm font-semibold shadow-sm transition active:scale-95">
            <span id="playIcon">▶</span>
            <span id="playLabel">재생</span>
          </button>
          <button id="btnStop" type="button" class="whitespace-nowrap px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 text-xs sm:text-sm font-medium transition" title="정지">
            ⏹ 정지
          </button>
          <button id="btnPrevVerse" type="button" class="whitespace-nowrap px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 text-xs sm:text-sm font-medium transition" title="이전 절">
            ◀ 이전 절
          </button>
          <button id="btnNextVerse" type="button" class="whitespace-nowrap px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 text-xs sm:text-sm font-medium transition" title="다음 절">
            다음 절 ▶
          </button>
          <button id="btnRecoverVoice" type="button" class="whitespace-nowrap px-2.5 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 text-xs sm:text-sm font-semibold transition" title="한글·영어 음성 복구 테스트">
            🔊 소리 복구
          </button>
          <button id="btnThemeToggle" type="button" class="whitespace-nowrap px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs sm:text-sm font-semibold transition" title="밝은 화면 / 어두운 화면 전환">🌙 어둡게</button>
          <button id="btnOptions" type="button" class="whitespace-nowrap px-2.5 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-800 text-xs sm:text-sm font-semibold transition" title="글씨 크기·색상·커서 속도 설정">
            ⚙ 설정
          </button>
          <button id="btnDownloadHtml" type="button" class="whitespace-nowrap px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 text-xs sm:text-sm font-medium transition" title="내 기기 브라우저에서 열기용 파일 저장">
            ⬇ 저장
          </button>
        </div>

        <div class="flex flex-wrap items-center gap-2 text-xs">
          <!-- Display Mode -->
          <div class="inline-flex rounded-lg bg-stone-100 p-0.5 border border-stone-200">
            <button type="button" data-mode="both" class="mode-btn px-2.5 py-1 rounded-md font-medium transition bg-white text-indigo-800 shadow-sm">한글·영어</button>
            <button type="button" data-mode="ko" class="mode-btn px-2.5 py-1 rounded-md font-medium transition text-slate-600 hover:text-slate-900">한글만</button>
            <button type="button" data-mode="en" class="mode-btn px-2.5 py-1 rounded-md font-medium transition text-slate-600 hover:text-slate-900">영어만</button>
          </div>

          <!-- Speed -->
          <label class="inline-flex items-center gap-1 bg-stone-100 px-2 py-1 rounded-lg border border-stone-200 text-slate-700">
            <span>속도</span>
            <select id="speedSelect" class="bg-transparent font-semibold text-indigo-800 focus:outline-none">
              <option value="0.75">0.75×</option>
              <option value="0.9">0.9×</option>
              <option value="1" selected>1.0×</option>
              <option value="1.15">1.15×</option>
              <option value="1.3">1.3×</option>
            </select>
          </label>

          <!-- Auto Advance Chapter -->
          <label class="inline-flex items-center gap-1.5 cursor-pointer bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-lg text-amber-900 font-medium">
            <input id="autoNextChapter" type="checkbox" checked class="accent-indigo-700 rounded">
            <span>한 장씩 자동 넘김</span>
          </label>

          <!-- Wake Lock -->
          <label class="inline-flex items-center gap-1.5 cursor-pointer bg-stone-100 border border-stone-200 px-2.5 py-1 rounded-lg text-slate-700 font-medium">
            <input id="wakeLockToggle" type="checkbox" class="accent-indigo-700 rounded">
            <span>화면 켜짐</span>
          </label>
        </div>
      </div>

      <!-- Inline Options Drawer inside Header -->
      <div id="optionsModal" class="hidden pt-3 mt-2 border-t space-y-3" style="border-color: var(--border-card)">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold">⚙ 화면 디자인 · 커서 싱크 미세조정</span>
          <button id="btnCloseOptions" type="button" class="px-2.5 py-1 rounded-lg bg-stone-200/80 hover:bg-stone-300 text-slate-800 text-xs font-semibold">접기 ✕</button>
        </div>

        <div class="space-y-1">
          <label class="block text-xs font-bold opacity-80">커서 속도 미세조정 (<span id="syncOffsetVal">1.00×</span> — 커서가 빠르면 왼쪽, 느리면 오른쪽)</label>
          <input id="syncOffsetSlider" type="range" min="0.6" max="1.6" step="0.05" value="1.0" class="w-full accent-indigo-700">
        </div>

        <div class="space-y-1">
          <label class="block text-xs font-bold opacity-80">바탕 화면 색깔</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" data-theme="cream" class="opt-theme px-3 py-2 rounded-xl border text-sm font-bold bg-[#faf8f5] text-slate-900 border-stone-300 ring-2 ring-indigo-500">☀ 밝게</button>
            <button type="button" data-theme="dark" class="opt-theme px-3 py-2 rounded-xl border text-sm font-bold bg-slate-900 text-slate-100 border-slate-700">🌙 어둡게</button>
          </div>
        </div>

        <div class="space-y-1">

            { v: 5, ko: '너의 길을 여호와께 맡기라 저를 의지하면 저가 이루시고', en: 'Commit thy way unto the LORD; trust also in him; and he shall bring it to pass.' },
            { v: 6, ko: '네 의를 빛같이 나타내시며 네 공의를 정오의 빛같이 하시리로다', en: 'And he shall bring forth thy righteousness as the light, and thy judgment as the noonday.' },
            { v: 7, ko: '여호와 앞에 잠잠하고 참아 기다리라 자기 길이 형통하며 악한 꾀를 이루는 자를 인하여 불평하여 말지어다', en: 'Rest in the LORD, and wait patiently for him: fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass.' },
            { v: 8, ko: '분을 그치고 노를 버리라 불평하여 말라 행악에 치우칠 뿐이라', en: 'Cease from anger, and forsake wrath: fret not thyself in any wise to do evil.' },
            { v: 9, ko: '대저 행악하는 자는 끊어질 것이나 여호와를 기대하는 자는 땅을 차지하리로다', en: 'For evildoers shall be cut off: but those that wait upon the LORD, they shall inherit the earth.' },
            { v: 10, ko: '잠시 후에 악인이 없어지리니 네가 그곳을 자세히 살필지라도 없으리로다', en: 'For yet a little while, and the wicked shall not be: yea, thou shalt diligently consider his place, and it shall not be.' },
            { v: 11, ko: '오직 온유한 자는 땅을 차지하며 풍부한 화평으로 즐기리로다', en: 'But the meek shall inherit the earth; and shall delight themselves in the abundance of peace.' },
            { v: 12, ko: '악인이 의인 치기를 꾀하고 향하여 그 이를 가는도다', en: 'The wicked plotteth against the just, and gnasheth upon him with his teeth.' },
            { v: 13, ko: '주께서 저를 웃으시리니 그 날의 이름을 보심이로다', en: 'The LORD shall laugh at him: for he seeth that his day is coming.' },
            { v: 14, ko: '악인이 칼을 빼고 활을 당기어 가난하고 궁핍한 자를 엎드러뜨리며 행위가 정직한 자를 죽이고자 하나', en: 'The wicked have drawn out the sword, and have bent their bow, to cast down the poor and needy, and to slay such as be of upright conversation.' },

            { v: 16, ko: '의인의 적은 소유가 많은 악인의 풍부함보다 승하도다', en: 'A little that a righteous man hath is better than the riches of many wicked.' },
            { v: 17, ko: '악인의 팔은 부러지나 의인은 여호와께서 붙드시는도다', en: 'For the arms of the wicked shall be broken: but the LORD upholdeth the righteous.' },

            { v: 22, ko: '주의 복을 받은 자는 땅을 차지하고 주의 저주를 받은 자는 끊어지리로다', en: 'For such as be blessed of him shall inherit the earth; and they that be cursed of him shall be cut off.' },
            { v: 23, ko: '여호와께서 사람의 걸음을 정하시고 그 길을 기뻐하시나니', en: 'The steps of a good man are ordered by the LORD: and he delighteth in his way.' },
            { v: 24, ko: '저는 넘어지나 아주 엎드러지지 아니함은 여호와께서 손으로 붙드심이로다', en: 'Though he fall, he shall not be utterly cast down: for the LORD upholdeth him with his hand.' },
            { v: 25, ko: '내가 어려서부터 늙기까지 의인이 버림을 당하거나 그 자손이 걸식함을 보지 못하였도다', en: 'I have been young, and now am old; yet have I not seen the righteous forsaken, nor his seed begging bread.' },

            { v: 29, ko: '의인이 땅을 차지함이여 거기 영영히 거하리로다', en: 'The righteous shall inherit the land, and dwell therein for ever.' },

            { v: 31, ko: '그 마음에는 하나님의 법이 있으니 그 걸음에 실족함이 없으리로다', en: 'The law of his God is in his heart; none of his steps shall slide.' },
            { v: 32, ko: '악인이 의인을 엿보아 살해할 기회를 찾으나', en: 'The wicked watcheth the righteous, and seeketh to slay him.' },
            { v: 33, ko: '여호와는 저를 그 손에 버려두지 아니하시고 재판 때에도 정죄치 아니하시리로다', en: 'The LORD will not leave him in his hand, nor condemn him when he is judged.' },

      wakeLockToggle: document.getElementById('wakeLockToggle'),
      testamentBadge: document.getElementById('testamentBadge'),
      chapterRef: document.getElementById('chapterRef'),
      chapterTitle: document.getElementById('chapterTitle'),
      chapterSubtitle: document.getElementById('chapterSubtitle'),
      btnPrevChapter: document.getElementById('btnPrevChapter'),
      btnNextChapter: document.getElementById('btnNextChapter'),
      chapterProgress: document.getElementById('chapterProgress'),
      statusText: document.getElementById('statusText'),
      ttsWarning: document.getElementById('ttsWarning'),
      versesContainer: document.getElementById('versesContainer')
    };

    function getCurrentChapter() {
      return BIBLE_DATA[state.testament][state.chapterIdx];
    }

    function tokenize(text) {
      return text.trim().split(/\s+/).filter(Boolean);
    }

    function renderTabs() {
      const isOld = state.testament === 'old';
      els.tabOld.className = `px-3.5 py-1.5 text-sm font-semibold rounded-lg transition-all ${
        isOld ? 'bg-indigo-700 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
      }`;
      els.tabNew.className = `px-3.5 py-1.5 text-sm font-semibold rounded-lg transition-all ${
        !isOld ? 'bg-indigo-700 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
      }`;

      const chapters = BIBLE_DATA[state.testament];
      els.chapterTabs.innerHTML = '';
      chapters.forEach((ch, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const active = idx === state.chapterIdx;
        btn.className = `px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border transition ${
          active
            ? 'bg-amber-100 border-amber-300 text-amber-950 font-semibold shadow-sm'
            : 'bg-white border-stone-200 text-slate-600 hover:bg-stone-50'
        }`;
        btn.textContent = ch.title;
        btn.addEventListener('click', () => {
          stopPlayback();
          state.chapterIdx = idx;
          state.activeVerseIdx = 0;
          state.activeWordIdx = -1;
          renderAll();
        });
        els.chapterTabs.appendChild(btn);
      });

      document.querySelectorAll('.mode-btn').forEach((btn) => {
        const active = btn.dataset.mode === state.displayMode;
        btn.className = `mode-btn px-2.5 py-1 rounded-md font-medium transition ${
          active ? 'bg-white text-indigo-800 shadow-sm' : 'text-slate-600 hover:text-slate-900'
        }`;
      });
    }

    function renderChapterHeader() {
      const chapters = BIBLE_DATA[state.testament];
      const ch = getCurrentChapter();
      els.testamentBadge.textContent = state.testament === 'old' ? '구약 (Old Testament)' : '신약 (New Testament)';
      els.chapterRef.textContent = ch.ref;
      els.chapterTitle.textContent = ch.title;
      els.chapterSubtitle.textContent = ch.subtitle;
      els.chapterProgress.textContent = `${state.chapterIdx + 1} / ${chapters.length}`;
      els.btnPrevChapter.disabled = state.chapterIdx === 0;
      els.btnNextChapter.disabled = state.chapterIdx === chapters.length - 1;
    }

    function buildTokenHtml(text, lang, verseIdx) {
      const tokens = tokenize(text);
      return tokens
        .map((tok, wIdx) => `<span class="word-token" data-v="${verseIdx}" data-lang="${lang}" data-w="${wIdx}">${escapeHtml(tok)}</span>`)
        .join(' ');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderVerses() {
      const ch = getCurrentChapter();
      els.versesContainer.innerHTML = '';

      ch.verses.forEach((item, idx) => {
        const card = document.createElement('article');
        card.id = `verse-card-${idx}`;
        card.className = 'verse-card themed-card rounded-2xl border p-4 sm:p-5 shadow-sm cursor-pointer hover:border-indigo-300';

        const koSizeClass = design.fontSize === 'xlarge' ? 'text-2xl sm:text-3xl' : design.fontSize === 'large' ? 'text-xl sm:text-2xl' : 'text-lg sm:text-xl';
        const enSizeClass = design.fontSize === 'xlarge' ? 'text-xl sm:text-2xl' : design.fontSize === 'large' ? 'text-lg sm:text-xl' : 'text-base sm:text-lg';

        let bodyHtml = `<div class="flex items-start gap-3">
          <div class="shrink-0 w-7 h-7 rounded-full bg-stone-100 text-slate-600 font-bold text-xs flex items-center justify-center mt-0.5 border border-stone-200" id="badge-${idx}">${item.v}</div>
          <div class="flex-1 space-y-2.5">`;

        if (state.displayMode === 'both' || state.displayMode === 'ko') {
          bodyHtml += `<p id="sent-${idx}-ko" class="serif-kr ${koSizeClass} leading-relaxed py-0.5">${buildTokenHtml(item.ko, 'ko', idx)}</p>`;
        }
        if (state.displayMode === 'both' || state.displayMode === 'en') {
          bodyHtml += `<p id="sent-${idx}-en" class="themed-en ${enSizeClass} leading-relaxed py-0.5">${buildTokenHtml(item.en, 'en', idx)}</p>`;
        }

        bodyHtml += `</div></div>`;
        card.innerHTML = bodyHtml;

        card.addEventListener('click', () => {
          jumpAndPlay(idx);
        });

        els.versesContainer.appendChild(card);
      });

      applyHighlights();
    }

    function applyHighlights() {
      const ch = getCurrentChapter();
      ch.verses.forEach((_, idx) => {
        const card = document.getElementById(`verse-card-${idx}`);
        const badge = document.getElementById(`badge-${idx}`);
        const koSent = document.getElementById(`sent-${idx}-ko`);
        const enSent = document.getElementById(`sent-${idx}-en`);
        if (!card) return;

        const isActiveVerse = (state.isPlaying || state.isPaused) && idx === state.activeVerseIdx;
        card.classList.toggle('verse-card-active', isActiveVerse);
        if (badge) {
          badge.className = `shrink-0 w-7 h-7 rounded-full font-bold text-xs flex items-center justify-center mt-0.5 border ${
            isActiveVerse
              ? 'bg-indigo-700 text-white border-indigo-700'
              : 'bg-stone-100 text-slate-600 border-stone-200'
          }`;
        }
        if (koSent) koSent.classList.toggle('sentence-block-active', isActiveVerse && state.activeLang === 'ko');
        if (enSent) enSent.classList.toggle('sentence-block-active', isActiveVerse && state.activeLang === 'en');
      });

      document.querySelectorAll('.word-token').forEach((el) => {
        el.classList.remove('word-done', 'word-active');
        const vIdx = Number(el.dataset.v);
        const lang = el.dataset.lang;
        const wIdx = Number(el.dataset.w);

        if (!(state.isPlaying || state.isPaused)) return;
        if (vIdx !== state.activeVerseIdx) return;

        if (state.displayMode === 'both' && state.activeLang === 'en' && lang === 'ko') {
          el.classList.add('word-done');
          return;
        }

        if (lang === state.activeLang && state.activeWordIdx >= 0) {
          if (wIdx < state.activeWordIdx) {
            el.classList.add('word-done');
          } else if (wIdx === state.activeWordIdx) {
            el.classList.add('word-active');
          }
        }
      });
    }

    function scrollToActiveVerse() {
      if (vr.verseReader.open) {
        positionReader();
        return;
      }
      const card = document.getElementById(`verse-card-${state.activeVerseIdx}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function updatePlayControls() {
      updateReaderControls();
      if (state.isPlaying && !state.isPaused) {
        els.playIcon.textContent = '⏸';
        els.playLabel.textContent = '일시정지';
        els.btnPlayPause.classList.remove('bg-indigo-700', 'hover:bg-indigo-800');
        els.btnPlayPause.classList.add('bg-amber-600', 'hover:bg-amber-700');
        els.miniPlayIcon.textContent = '⏸';
        els.miniPlayLabel.textContent = '일시정지';
        els.miniPlayBtn.classList.remove('bg-indigo-700', 'hover:bg-indigo-800');
        els.miniPlayBtn.classList.add('bg-amber-600', 'hover:bg-amber-700');
      } else {
        els.playIcon.textContent = '▶';
        els.playLabel.textContent = state.isPaused ? '계속 재생' : '재생';
        els.btnPlayPause.classList.remove('bg-amber-600', 'hover:bg-amber-700');
        els.btnPlayPause.classList.add('bg-indigo-700', 'hover:bg-indigo-800');
        els.miniPlayIcon.textContent = '▶';
        els.miniPlayLabel.textContent = state.isPaused ? '계속' : '재생';
        els.miniPlayBtn.classList.remove('bg-amber-600', 'hover:bg-amber-700');
        els.miniPlayBtn.classList.add('bg-indigo-700', 'hover:bg-indigo-800');
      }
    }

    function clearTimers() {
      if (sweepRafId) {
        cancelAnimationFrame(sweepRafId);
        sweepRafId = null;
      }
      if (fallbackTimerId) {
        clearTimeout(fallbackTimerId);
        fallbackTimerId = null;
      }
    }

    function stopPlayback() {
      playSessionId++;
      clearTimers();
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      } catch (e) {}
      state.isPlaying = false;
      state.isPaused = false;
      state.activeWordIdx = -1;
      updatePlayControls();
      applyHighlights();
      els.statusText.innerHTML = '원하는 절을 누르거나 <strong>▶ 재생</strong>을 누르면 한글 한 문장, 영어 한 문장 순서로 색깔이 따라갑니다.';
    }

    function getLangSequence() {
      if (state.displayMode === 'ko') return ['ko'];
      if (state.displayMode === 'en') return ['en'];
      return ['ko', 'en'];
    }

    let cachedVoices = [];
    function refreshVoices() {
      try {
        if ('speechSynthesis' in window) {
          cachedVoices = window.speechSynthesis.getVoices() || [];
        }
      } catch (e) {}
      return cachedVoices;
    }

    function pickVoice(langCode) {
      const voices = cachedVoices.length ? cachedVoices : refreshVoices();
      if (!voices || !voices.length) return null;
      const exact = voices.find((v) => v.lang && v.lang.toLowerCase() === langCode.toLowerCase());
      if (exact) return exact;
      const prefix = langCode.split('-')[0].toLowerCase();
      return voices.find((v) => v.lang && v.lang.toLowerCase().startsWith(prefix)) || null;
    }

    function unlockSpeechOnGesture() {
      try {
        if ('speechSynthesis' in window) {
          refreshVoices();
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
        }
      } catch (e) {}
    }

    const adaptiveMsPerWeight = { ko: 265, en: 102 };

    function computeTokenWeights(tokens, lang) {
      const weights = tokens.map((tok) => {
        const cleanLen = tok.replace(/[,.!?;:'"()\-]/g, '').length || 1;
        let pause = 0;
        if (/[.!?]$/.test(tok)) pause = lang === 'ko' ? 2.2 : 3.0;
        else if (/[,;:]$/.test(tok)) pause = lang === 'ko' ? 1.4 : 2.0;
        return cleanLen + pause;
      });
      const total = weights.reduce((a, b) => a + b, 0) || 1;
      const cumulative = [];
      let acc = 0;
      for (const w of weights) {
        acc += w;
        cumulative.push(acc / total);
      }
      return { totalWeight: total, cumulative };
    }

    function estimateDurationMs(totalWeight, lang) {
      const msPerW = adaptiveMsPerWeight[lang] || 140;
      const userFactor = design.syncFactor || 1.0;
      return Math.max(900, (totalWeight * msPerW) / (state.speed * userFactor));
    }

    function speakSentence(verseIdx, lang, session) {
      if (session !== playSessionId || !state.isPlaying || state.isPaused) return;

      const ch = getCurrentChapter();
      const verse = ch.verses[verseIdx];
      if (!verse) {
        handleChapterComplete(session);
        return;
      }

      state.activeVerseIdx = verseIdx;
      state.activeLang = lang;
      state.activeWordIdx = 0;

      const text = lang === 'ko' ? verse.ko : verse.en;
      const tokens = tokenize(text);
      const tokenStarts = [];
      let cursor = 0;
      for (const tok of tokens) {
        const pos = text.indexOf(tok, cursor);
        tokenStarts.push(pos >= 0 ? pos : cursor);
        cursor = (pos >= 0 ? pos : cursor) + tok.length;
      }

      const { totalWeight, cumulative } = computeTokenWeights(tokens, lang);
      const estMs = estimateDurationMs(totalWeight, lang);

      els.statusText.textContent = `${ch.title} ${verse.v}절 (${lang === 'ko' ? '한글 낭독' : 'English'}) 따라읽는 중...`;
      applyHighlights();
      scrollToActiveVerse();

      clearTimers();
      let sweepStartTime = null;
      let boundaryDriven = false;

      function startSweepLoop() {
        if (sweepStartTime !== null) return;
        sweepStartTime = performance.now();
        function animateSweep(now) {
          if (session !== playSessionId || !state.isPlaying || state.isPaused) return;
          if (!boundaryDriven) {
            const progress = Math.min(0.995, (now - sweepStartTime) / estMs);
            let nextIdx = tokens.length - 1;
            for (let i = 0; i < cumulative.length; i++) {
              if (progress <= cumulative[i]) {
                nextIdx = i;
                break;
              }
            }
            if (nextIdx !== state.activeWordIdx) {
              state.activeWordIdx = nextIdx;
              applyHighlights();
            }
          }
          sweepRafId = requestAnimationFrame(animateSweep);
        }
        sweepRafId = requestAnimationFrame(animateSweep);
      }

      const finishSentence = () => {
        if (session !== playSessionId) return;
        clearTimers();
        state.activeWordIdx = tokens.length;
        applyHighlights();
        advanceAfterSentence(verseIdx, lang, session);
      };

      const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
      if (!hasTTS) {
        els.ttsWarning.classList.remove('hidden');
        els.ttsWarning.textContent = '이 환경에서는 음성이 지원되지 않아 ⬇ 저장 후 브라우저에서 열어주세요.';
        startSweepLoop();
        fallbackTimerId = setTimeout(finishSentence, estMs);
        return;
      }

      try {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang === 'ko' ? 'ko-KR' : 'en-US';
        utter.rate = state.speed;
        utter.volume = 1.0;
        const voice = pickVoice(utter.lang);
        if (voice) utter.voice = voice;

        let settled = false;
        let ttsStarted = false;

        utter.onstart = () => {
          if (session !== playSessionId || settled) return;
          ttsStarted = true;
          els.ttsWarning.classList.add('hidden');
          setTimeout(() => {
            if (session === playSessionId && !settled && state.isPlaying && !state.isPaused) {
              startSweepLoop();
            }
          }, 160);
        };

        utter.onboundary = (ev) => {
          if (session !== playSessionId || typeof ev.charIndex !== 'number') return;
          if (sweepStartTime === null) startSweepLoop();
          boundaryDriven = true;
          let found = 0;
          for (let i = 0; i < tokenStarts.length; i++) {
            if (ev.charIndex >= tokenStarts[i]) found = i;
          }
          if (found !== state.activeWordIdx) {
            state.activeWordIdx = found;
            applyHighlights();
          }
        };

        utter.onend = () => {
          if (settled) return;
          settled = true;
          if (sweepStartTime !== null && totalWeight > 0) {
            const actualMs = Math.max(800, (performance.now() - sweepStartTime) - 450);
            const measuredRate = (actualMs * state.speed) / totalWeight;
            if (measuredRate > 40 && measuredRate < 600) {
              adaptiveMsPerWeight[lang] = adaptiveMsPerWeight[lang] * 0.25 + measuredRate * 0.75;
            }
          }
          finishSentence();
        };

        utter.onerror = () => {
          if (settled || session !== playSessionId) return;
          settled = true;
          els.ttsWarning.classList.remove('hidden');
          els.ttsWarning.textContent = '음성 재생이 차단되었을 수 있습니다. [🔊 소리 복구] 또는 [⬇ 저장] 후 브라우저에서 열어주세요.';
          startSweepLoop();
          fallbackTimerId = setTimeout(finishSentence, estMs);
        };

        setTimeout(() => {
          if (!ttsStarted && !settled && session === playSessionId && state.isPlaying && !state.isPaused) {
            els.ttsWarning.classList.remove('hidden');
            els.ttsWarning.textContent = '카카오톡·미리보기 창에서는 음성이 차단됩니다. [⋮ → 다른 브라우저로 열기] 또는 [⬇ 저장] 후 크롬/삼성 인터넷에서 열어주세요.';
            startSweepLoop();
          }
        }, 1500);

        fallbackTimerId = setTimeout(() => {
          if (!settled && session === playSessionId && state.isPlaying && !state.isPaused) {
            settled = true;
            try { window.speechSynthesis.cancel(); } catch (e) {}
            finishSentence();
          }
        }, estMs + 6000);

        window.speechSynthesis.speak(utter);
      } catch (e) {
        startSweepLoop();
        fallbackTimerId = setTimeout(finishSentence, estMs);
      }
    }

    function advanceAfterSentence(verseIdx, lang, session) {
      if (session !== playSessionId || !state.isPlaying || state.isPaused) return;
      const seq = getLangSequence();
      const langPos = seq.indexOf(lang);

      if (langPos < seq.length - 1) {
        speakSentence(verseIdx, seq[langPos + 1], session);
        return;
      }

      if (vr.verseReader.open) {
        stopPlayback();
        vr.vrStatus.textContent = '이 절 낭독을 마쳤습니다.';
        return;
      }

      const ch = getCurrentChapter();
      if (verseIdx < ch.verses.length - 1) {
        speakSentence(verseIdx + 1, seq[0], session);
      } else {
        handleChapterComplete(session);
      }
    }

    function handleChapterComplete(session) {
      if (session !== playSessionId) return;
      const chapters = BIBLE_DATA[state.testament];
      if (state.autoNextChapter && state.chapterIdx < chapters.length - 1) {
        state.chapterIdx++;
        state.activeVerseIdx = 0;
        state.activeWordIdx = -1;
        renderAll();
        const seq = getLangSequence();
        setTimeout(() => speakSentence(0, seq[0], session), 450);
      } else {
        stopPlayback();
        els.statusText.textContent = `${getCurrentChapter().title} 낭독이 완료되었습니다.`;
      }
    }

    function startPlayback(fromVerseIdx = state.activeVerseIdx) {
      playSessionId++;
      const session = playSessionId;
      unlockSpeechOnGesture();
      try {
        if ('speechSynthesis' in window && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
          window.speechSynthesis.cancel();
        }
      } catch (e) {}
      state.isPlaying = true;
      state.isPaused = false;
      state.activeVerseIdx = fromVerseIdx;
      const seq = getLangSequence();
      updatePlayControls();
      speakSentence(fromVerseIdx, seq[0], session);
    }

    function jumpAndPlay(verseIdx) {
      state.activeVerseIdx = verseIdx;
      startPlayback(verseIdx);
    }

    function renderAll() {
      renderTabs();
      renderChapterHeader();
      renderVerses();
      renderVerseReader();
      updatePlayControls();
    }

    els.tabOld.addEventListener('click', () => {
      if (state.testament === 'old') return;
      stopPlayback();
      state.testament = 'old';
      state.chapterIdx = 0;
      state.activeVerseIdx = 0;
      renderAll();
    });

    els.tabNew.addEventListener('click', () => {
      if (state.testament === 'new') return;
      stopPlayback();
      state.testament = 'new';
      state.chapterIdx = 0;
      state.activeVerseIdx = 0;
      renderAll();
    });

    document.querySelectorAll('.mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const wasPlaying = state.isPlaying && !state.isPaused;
        const currentV = state.activeVerseIdx;
        if (wasPlaying) stopPlayback();
        state.displayMode = btn.dataset.mode;
        renderAll();
        if (wasPlaying) startPlayback(currentV);
      });
    });

    els.btnPlayPause.addEventListener('click', () => {
      if (!state.isPlaying) {
        startPlayback(state.activeVerseIdx);
      } else if (!state.isPaused) {
        playSessionId++;
        clearTimers();
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
        state.isPaused = true;
        updatePlayControls();
        applyHighlights();
        els.statusText.textContent = '일시정지됨 · ▶ 계속 재생을 누르면 현재 절부터 다시 따라갑니다.';
      } else {
        startPlayback(state.activeVerseIdx);
      }
    });

    els.btnStop.addEventListener('click', stopPlayback);
    els.miniPlayBtn.addEventListener('click', () => els.btnPlayPause.click());
    els.miniStopBtn.addEventListener('click', stopPlayback);
    els.miniPrevBtn.addEventListener('click', () => els.btnPrevVerse.click());
    els.miniNextBtn.addEventListener('click', () => els.btnNextVerse.click());

    els.btnPrevVerse.addEventListener('click', () => {
      const target = Math.max(0, state.activeVerseIdx - 1);
      if (state.isPlaying) {
        startPlayback(target);
      } else {
        state.activeVerseIdx = target;
        scrollToActiveVerse();
      }
    });

    els.btnNextVerse.addEventListener('click', () => {
      const ch = getCurrentChapter();
      const target = Math.min(ch.verses.length - 1, state.activeVerseIdx + 1);
      if (state.isPlaying) {
        startPlayback(target);
      } else {
        state.activeVerseIdx = target;
        scrollToActiveVerse();
      }
    });

    els.btnPrevChapter.addEventListener('click', () => {
      if (state.chapterIdx === 0) return;
      stopPlayback();
      state.chapterIdx--;
      state.activeVerseIdx = 0;
      renderAll();
    });

    els.btnNextChapter.addEventListener('click', () => {
      const chapters = BIBLE_DATA[state.testament];
      if (state.chapterIdx >= chapters.length - 1) return;
      stopPlayback();
      state.chapterIdx++;
      state.activeVerseIdx = 0;
      renderAll();
    });

    els.speedSelect.addEventListener('change', (e) => {
      state.speed = parseFloat(e.target.value) || 1.0;
      if (state.isPlaying && !state.isPaused) {
        startPlayback(state.activeVerseIdx);
      }
    });

    els.autoNextChapter.addEventListener('change', (e) => {
      state.autoNextChapter = e.target.checked;
    });

    els.wakeLockToggle.addEventListener('change', async (e) => {
      if (e.target.checked) {
        try {
          if ('wakeLock' in navigator) {
            state.wakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (err) {}
      } else {
        try {
          if (state.wakeLock) {
            await state.wakeLock.release();
            state.wakeLock = null;
          }
        } catch (err) {}
      }
    });

    els.btnRecoverVoice.addEventListener('click', () => {
      stopPlayback();
      if (!('speechSynthesis' in window)) {
        els.ttsWarning.classList.remove('hidden');
        els.ttsWarning.textContent = '이 브라우저는 음성 합성을 지원하지 않습니다. [⬇ 저장] 후 Chrome/Safari에서 열어주세요.';
        return;
      }
      try {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        refreshVoices();
        const testUtter = new SpeechSynthesisUtterance('한글 음성이 준비되었습니다.');
        testUtter.lang = 'ko-KR';
        const v = pickVoice('ko-KR');
        if (v) testUtter.voice = v;
        testUtter.onstart = () => {
          els.ttsWarning.classList.add('hidden');

    const vr = Object.fromEntries([
      'verseReader', 'verseMode', 'vrExit', 'vrChapter', 'vrFeed', 'vrPosition',
      'vrPrev', 'vrNext', 'vrListen', 'vrLike', 'vrNote', 'vrShare', 'vrStudy',
      'vrStatus', 'vrDialog', 'vrDialogTitle', 'vrDialogRef', 'vrDialogStatus',
      'vrNoteForm', 'vrNoteInput', 'vrSharePanel', 'vrShareText', 'vrCopyShare',
      'vrStudyPanel', 'vrStudyNotes', 'vrAskAi', 'vrCopyQuestion'
    ].map(id => [id, document.getElementById(id)]));
    const verseStorageKey = 'bible_reader_verse_marks_v1';
    let verseMarks = {};
    let readerScrollFrame = 0;
    let dialogVerseKey = '';
    let studyQuestion = '';

    function loadVerseMarks() {
      try {
        const saved = JSON.parse(localStorage.getItem(verseStorageKey) || '{}');
        if (saved && typeof saved === 'object' && !Array.isArray(saved)) verseMarks = saved;
      } catch (_) {}
    }

    function saveVerseMark(key, update) {
      loadVerseMarks();
      const next = { ...verseMarks, [key]: { ...verseMarks[key], ...update } };
      if (!next[key].liked && !next[key].note) delete next[key];
      try {
        localStorage.setItem(verseStorageKey, JSON.stringify(next));
        verseMarks = next;
        return true;
      } catch (_) {
        return false;
      }
    }

    function verseReference(chapter, verse) {
      if (chapter.id === 'matthew6_lords_prayer') return '마태복음 6:' + verse.v;
      if (chapter.id === 'matthew5_beatitudes') return '마태복음 5:' + verse.v;
      return chapter.title + ' ' + verse.v + '절';
    }

    function currentReaderVerse() {
      const chapter = getCurrentChapter();
      const verse = chapter.verses[state.activeVerseIdx];
      return { chapter, verse, key: chapter.id + ':' + verse.v, reference: verseReference(chapter, verse) };
    }

    function updateReaderControls() {
      if (!vr.verseReader.open) return;
      const { chapter, verse, key } = currentReaderVerse();
      const mark = verseMarks[key] || {};
      vr.vrPosition.textContent = verse.v + '절 · ' + (state.activeVerseIdx + 1) + ' / ' + chapter.verses.length;
      vr.vrPrev.disabled = state.activeVerseIdx === 0;
      vr.vrNext.disabled = state.activeVerseIdx === chapter.verses.length - 1;
      vr.vrListen.textContent = state.isPlaying && !state.isPaused ? '■ 낭독 정지' : '▶ 이 절 듣기';
      vr.vrLike.setAttribute('aria-pressed', String(Boolean(mark.liked)));
      vr.vrLike.textContent = mark.liked ? '♥ 좋아요' : '♡ 좋아요';
      vr.vrNote.textContent = mark.note ? '메모 편집' : '메모';
      vr.vrFeed.querySelector('.vr-active')?.classList.remove('vr-active');
      vr.vrFeed.children[state.activeVerseIdx]?.classList.add('vr-active');
    }

    function feedOffset(slide) {
      return slide.offsetTop - vr.vrFeed.firstElementChild.offsetTop;
    }

    function positionReader() {
      if (!vr.verseReader.open) return;
      const slide = vr.vrFeed.children[state.activeVerseIdx];
      if (slide) vr.vrFeed.scrollTop = feedOffset(slide);
      updateReaderControls();
    }

    function renderVerseReader() {
      if (!vr.verseReader.open) return;
      const chapter = getCurrentChapter();
      vr.vrChapter.value = chapter.id;
      vr.verseReader.dataset.fontSize = design.fontSize;
      const slides = chapter.verses.map(verse => {
        const slide = document.createElement('div');
        slide.className = 'vr-slide';
        const card = document.createElement('article');
        card.className = 'vr-card';
        const reference = document.createElement('h2');
        reference.className = 'vr-ref';
        reference.textContent = verseReference(chapter, verse);
        card.append(reference);
        for (const lang of getLangSequence()) {
          const paragraph = document.createElement('p');
          paragraph.className = 'vr-' + lang;
          paragraph.lang = lang;
          paragraph.textContent = verse[lang];
          card.append(paragraph);
        }
        slide.append(card);
        return slide;
      });
      vr.vrFeed.replaceChildren(...slides);
      vr.vrStatus.textContent = '';
      positionReader();
    }

    function openVerseReader() {
      loadVerseMarks();
      vr.verseReader.hidden = false;
      vr.verseReader.showModal();
      renderVerseReader();
      vr.vrFeed.focus({ preventScroll: true });
    }

    function selectReaderChapter(id, verseNumber) {
      for (const [testament, chapters] of Object.entries(BIBLE_DATA)) {
        const chapterIdx = chapters.findIndex(chapter => chapter.id === id);
        if (chapterIdx < 0) continue;
        const verseIdx = verseNumber === undefined ? 0 : chapters[chapterIdx].verses.findIndex(verse => verse.v === verseNumber);
        if (verseIdx < 0) return false;
        stopPlayback();
        Object.assign(state, { testament, chapterIdx, activeVerseIdx: verseIdx });
        renderAll();
        return true;
      }
      return false;
    }

    function selectReaderVerse(index, reposition = true) {
      const last = getCurrentChapter().verses.length - 1;
      const target = Math.min(last, Math.max(0, index));
      if (target !== state.activeVerseIdx) {
        stopPlayback();
        state.activeVerseIdx = target;
        vr.vrStatus.textContent = '';
      }
      if (reposition) positionReader();
      else updateReaderControls();
    }

    function openReaderDialog(title, panel, reference) {
      vr.vrDialogTitle.textContent = title;
      vr.vrDialogRef.textContent = reference;
      vr.vrDialogStatus.textContent = '';
      for (const element of [vr.vrNoteForm, vr.vrSharePanel, vr.vrStudyPanel]) element.hidden = element !== panel;
      vr.vrDialog.showModal();
    }

    function readerShareText(chapter, verse, reference) {
      const lines = [reference, ...getLangSequence().map(lang => verse[lang])];
      const url = new URL(location.href);
      if (url.protocol === 'https:' || url.protocol === 'http:') {
        url.search = '';
        url.hash = '';
        url.searchParams.set('verse', chapter.id + ':' + verse.v);
        lines.push(url.href);
      }
      return lines.join('\n\n');
    }

    async function copyReaderText(value, status, fallback) {
      try {
        await navigator.clipboard.writeText(value);
        status.textContent = '복사했습니다.';
      } catch (_) {
        if (fallback) {
          fallback.focus();
          fallback.select();
          status.textContent = '선택한 내용을 직접 복사해 주세요.';
        } else {
          status.textContent = '복사를 사용할 수 없습니다. ChatGPT에 질문 버튼으로 열어 주세요.';
        }
      }
    }

    function addStudySection(title, content) {
      const heading = document.createElement('h3');
      heading.textContent = title;
      const paragraph = document.createElement('p');
      paragraph.textContent = content;
      vr.vrStudyNotes.append(heading, paragraph);
    }

    for (const chapters of Object.values(BIBLE_DATA)) {
      for (const chapter of chapters) vr.vrChapter.add(new Option(chapter.title, chapter.id));
    }

    vr.verseMode.addEventListener('click', openVerseReader);
    vr.vrExit.addEventListener('click', () => vr.verseReader.close());
    vr.verseReader.addEventListener('close', () => {
      vr.verseReader.hidden = true;
      stopPlayback();
      vr.verseMode.focus({ preventScroll: true });
      scrollToActiveVerse();
    });
    vr.vrChapter.addEventListener('change', () => selectReaderChapter(vr.vrChapter.value));
    vr.vrPrev.addEventListener('click', () => selectReaderVerse(state.activeVerseIdx - 1));
    vr.vrNext.addEventListener('click', () => selectReaderVerse(state.activeVerseIdx + 1));
    vr.vrFeed.addEventListener('keydown', event => {
      if (['ArrowUp', 'PageUp', 'ArrowDown', 'PageDown'].includes(event.key)) {
        event.preventDefault();
        selectReaderVerse(state.activeVerseIdx + (['ArrowUp', 'PageUp'].includes(event.key) ? -1 : 1));
      }
    });
    vr.vrFeed.addEventListener('scroll', () => {
      cancelAnimationFrame(readerScrollFrame);
      readerScrollFrame = requestAnimationFrame(() => {
        if (!vr.verseReader.open) return;
        const midpoint = vr.vrFeed.scrollTop + vr.vrFeed.clientHeight / 2;
        const slides = Array.from(vr.vrFeed.children);
        const visible = slides.findIndex(slide => feedOffset(slide) + slide.offsetHeight > midpoint);
        if (visible >= 0 && visible !== state.activeVerseIdx) selectReaderVerse(visible, false);
      });
    }, { passive: true });
    vr.vrListen.addEventListener('click', () => {
      if (state.isPlaying && !state.isPaused) stopPlayback();
      else startPlayback(state.activeVerseIdx);
    });
    vr.vrLike.addEventListener('click', () => {
      const { key } = currentReaderVerse();
      loadVerseMarks();
      const liked = !verseMarks[key]?.liked;
      const saved = saveVerseMark(key, { liked });
      updateReaderControls();
      vr.vrStatus.textContent = saved ? (liked ? '좋아요를 저장했습니다.' : '좋아요를 취소했습니다.') : '이 브라우저에서는 좋아요를 저장할 수 없습니다.';
    });
    vr.vrNote.addEventListener('click', () => {
      const { key, reference } = currentReaderVerse();
      dialogVerseKey = key;
      loadVerseMarks();
      vr.vrNoteInput.value = verseMarks[key]?.note || '';
      openReaderDialog('구절 메모', vr.vrNoteForm, reference);
      vr.vrNoteInput.focus();
    });
    vr.vrNoteForm.addEventListener('submit', event => {
      event.preventDefault();
      const note = vr.vrNoteInput.value.trim();
      if (saveVerseMark(dialogVerseKey, { note })) {
        vr.vrDialog.close();
        updateReaderControls();
        vr.vrStatus.textContent = note ? '메모를 저장했습니다.' : '메모를 지웠습니다.';
      } else {
        vr.vrDialogStatus.textContent = '이 브라우저에서는 메모를 저장할 수 없습니다.';
      }
    });
    vr.vrShare.addEventListener('click', async () => {
      const { chapter, verse, reference } = currentReaderVerse();
      const text = readerShareText(chapter, verse, reference);
      if (typeof navigator.share === 'function') {
        try {
          await navigator.share({ title: reference, text });
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
        }
      }
      vr.vrShareText.value = text;
      openReaderDialog('구절 공유', vr.vrSharePanel, reference);
    });
    vr.vrCopyShare.addEventListener('click', () => copyReaderText(vr.vrShareText.value, vr.vrDialogStatus, vr.vrShareText));
    vr.vrStudy.addEventListener('click', () => {
      const { chapter, reference, key } = currentReaderVerse();
      const note = VERSE_STUDY[key];
      const isPsalm = chapter.id.startsWith('psalm');
      vr.vrStudyNotes.replaceChildren();
      if (note) {
        addStudySection('뜻', note.meaning);
        addStudySection('문맥', note.context);
        addStudySection('히브리어', note.original);
        const source = document.createElement('a');
        source.href = 'https://biblehub.com/interlinear/psalms/' + chapter.id.slice(5) + '.htm';
        source.target = '_blank';
        source.rel = 'noopener noreferrer';
        source.textContent = '히브리어 원문 대조';
        vr.vrStudyNotes.append(source);
      } else {
        const paragraph = document.createElement('p');
        paragraph.textContent = 'ChatGPT에 이 구절의 뜻과 배경, ' + (isPsalm ? '히브리어' : '그리스어') + ' 핵심 단어를 질문할 수 있습니다.';
        vr.vrStudyNotes.append(paragraph);
      }
      studyQuestion = reference + '의 뜻과 앞뒤 문맥을 쉬운 한국어로 설명해 주세요. ' +
        (isPsalm ? '히브리어' : '그리스어') + ' 핵심 단어 1~2개의 원문 표기, 읽는 법, 이 구절에서의 뜻을 알려 주세요. 가능한 해석이 여럿이면 구분하고, 확인할 수 있는 출처도 밝혀 주세요.';
      const aiUrl = new URL('https://chatgpt.com/');
      aiUrl.searchParams.set('q', studyQuestion);
      vr.vrAskAi.href = aiUrl.href;
      openReaderDialog('구절 공부', vr.vrStudyPanel, reference);
    });
    vr.vrCopyQuestion.addEventListener('click', () => copyReaderText(studyQuestion, vr.vrDialogStatus));
    window.addEventListener('storage', event => {
      if (event.key === verseStorageKey || event.key === null) {
        verseMarks = {};
        loadVerseMarks();
        updateReaderControls();
      }
    });

    function openSharedVerse() {
      const key = new URLSearchParams(location.search).get('verse') || '';
      const match = /^([a-z0-9_]+):(\d+)$/.exec(key);
      if (match && selectReaderChapter(match[1], Number(match[2]))) openVerseReader();
    }

    applyDesign(false);
    renderAll();
    openSharedVerse();
  </script>
</body>
</html>
